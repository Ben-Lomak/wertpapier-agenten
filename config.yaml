# Wertpapier-Agenten: Simulation, kein echtes Geld.
# Alle Beträge in EUR. Prozentwerte als Dezimalzahl (0.25 % = 0.0025).

start_capital_eur: 10000
start_date_backtest: "2016-01-01"
benchmark: "URTH"          # iShares MSCI World (USD), dient als Vergleich und Marktfilter

# ---------------------------------------------------------------
# Steuern Portugal (vereinfachtes Modell, ersetzt keine Steuerberatung)
# ---------------------------------------------------------------
tax:
  country: PT
  flat_rate: 0.28                 # taxa autónoma auf Kursgewinne
  short_term_days: 365            # Haltedauer unter 365 Tagen = kurzfristig
  # englobamento obrigatório: kurzfristige Gewinne werden progressiv besteuert,
  # wenn dein Gesamteinkommen den höchsten IRS-Steuersatz erreicht.
  short_term_mode: progressive    # progressive | flat
  marginal_rate: 0.48             # dein Grenzsteuersatz (höchste Stufe 48 %)
  solidarity_surcharge: 0.0       # taxa adicional de solidariedade, falls relevant (0.025 / 0.05)
  loss_carryforward_years: 5      # Verlustvortrag (setzt englobamento voraus)
  holding_exemptions:             # steuerfreier Anteil des Gewinns nach Haltedauer
    - {min_years: 8, exempt: 0.30}
    - {min_years: 5, exempt: 0.20}
    - {min_years: 2, exempt: 0.10}

# ---------------------------------------------------------------
# Broker-Kostenmodelle (Stand November 2026)
# ---------------------------------------------------------------
brokers:
  n26:
    label: "N26 Standard"
    fee_per_order: 0.90           # pauschal je Order seit 02.09.2026
    free_orders_per_month: 0      # N26 Go: 3, N26 Metal: 10
    commission_pct: 0.0
    min_commission: 0.0
    fx_fee_pct: 0.0               # keine Fremdwährungsgebühr
    spread_pct: 0.0015            # angenommener Spread (Kauf bis Verkauf)
    slippage_pct: 0.0005
  revolut:
    label: "Revolut Standard"
    fee_per_order: 0.0
    free_orders_per_month: 1      # Plus 3, Premium 5, Metal/Ultra 10
    commission_pct: 0.0025        # 0,25 % (Ultra/Trading Pro: 0,12 % ohne Minimum)
    min_commission: 1.0
    fx_fee_pct: 0.0               # innerhalb Fair-Usage, danach planabhängig
    spread_pct: 0.0015
    slippage_pct: 0.0005

# ---------------------------------------------------------------
# Risikomanager (gilt für beide Agenten, hat Vetorecht)
# ---------------------------------------------------------------
risk:
  max_position_pct: 0.15          # höchstens 15 % des Depots pro Titel
  trailing_stop_pct: 0.12         # Verkauf bei 12 % unter Höchststand seit Kauf
  max_drawdown_pct: 0.15          # Kill-Switch (pro Agent abschaltbar mit null)
  cooldown_days: 30               # Handelstage Pause nach Kill-Switch
  capital_floor_pct: 0.25         # Kapital-Boden: bei 25 % Verlust auf das Startkapital stoppt der Agent endgültig
  market_filter_sma: 200          # Benchmark unter 200-Tage-Schnitt = keine neuen Käufe, Bestand raus
  cash_buffer_pct: 0.02           # 2 % Cash für Gebühren
  min_order_eur: 250              # kleinere Orders lohnen sich nach Kosten selten
  drift_threshold: 0.05           # bestehende Positionen nur bei 5 %-Punkten Abweichung anpassen

# ---------------------------------------------------------------
# Agenten. Jeder Agent läuft parallel mit beiden Broker-Modellen.
# ---------------------------------------------------------------
agents:
  # Auswahl nach Variantenvergleich vom 27.11.2026 (siehe reports/research.md)
  momentum:
    label: "Momentum Global"
    universe: universes/global_momentum.txt
    strategy: momentum
    positions: 8
    rebalance: monthly
    lookback_days: 252
    blend_lookbacks: [126, 252]   # Mittel aus 6- und 12-Monats-Performance
    skip_days: 21
    trend_sma: 200
    hold_buffer: 2.0              # Bestand bleibt, solange er unter den Top 16 ist
    risk:
      trailing_stop_pct: 0.25
      max_drawdown_pct: null      # Kill-Switch aus: hat im Test mehr gekostet als geschützt
      market_filter_buffer: 0.03
      drift_threshold: 0.10
  sustainable:
    label: "Nachhaltig"
    universe: universes/sustainable.txt
    strategy: sustainable
    positions: 10
    rebalance: monthly
    lookback_days: 252
    skip_days: 21
    trend_sma: 200
    vol_days: 63
    momentum_weight: 0.6
    hold_buffer: 2.0
    risk:
      trailing_stop_pct: 0.25
      max_drawdown_pct: null
      market_filter_buffer: 0.03
      drift_threshold: 0.10
  benchmark:
    label: "MSCI World halten"
    universe: [EUNL.DE]
    strategy: buyhold
    positions: 1
    rebalance: monthly
    market_filter: false
    risk:
      trailing_stop_pct: null
      max_drawdown_pct: null
      max_position_pct: 0.98
      drift_threshold: 0.5
  high_risk:
    label: "High Risk: KI, Robotik, Raumfahrt"
    universe: universes/high_risk_ai_robotics_space.txt
    strategy: momentum
    positions: 6
    rebalance: monthly
    lookback_days: 126
    blend_lookbacks: [63, 126, 252]   # kurze Fenster, weil viele Titel jung sind
    skip_days: 5
    trend_sma: 100
    hold_buffer: 1.5
    market_filter: false              # kein Ausstieg bei schwachem Gesamtmarkt
    risk:
      max_drawdown_pct: null          # kein Kill-Switch
      trailing_stop_pct: 0.35         # nur grobe Absicherung pro Titel
      capital_floor_pct: 0.50         # harte Grenze: Stopp bei 5.000 €
      max_position_pct: 0.17
      drift_threshold: 0.12
