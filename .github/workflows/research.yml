name: Variantenvergleich

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bots.runner research
      - run: cat reports/research.md >> "$GITHUB_STEP_SUMMARY"
      - name: Ergebnis speichern
        run: |
          git config user.name  "wertpapier-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/research.md
          git diff --cached --quiet || git commit -m "Variantenvergleich $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
