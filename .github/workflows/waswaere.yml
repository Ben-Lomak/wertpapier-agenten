name: Was wäre wenn

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Kaufdatum (JJJJ-MM-TT)"
        default: "2012-01-03"
      legs:
        description: "Titel=Betrag, mit Leerzeichen getrennt"
        default: "NVDA=5000 TSLA=5000"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tools.waswaere "${{ inputs.start }}" ${{ inputs.legs }}
      - run: cat reports/waswaere.md >> "$GITHUB_STEP_SUMMARY"
      - run: |
          git config user.name  "wertpapier-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/waswaere.md
          git diff --cached --quiet || git commit -m "Was wäre wenn $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
