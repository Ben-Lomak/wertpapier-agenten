name: Backtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bots.runner backtest
      - run: cat reports/backtest_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Bericht im Repository speichern
        run: |
          cp reports/backtest.html docs/backtest.html
          git config user.name  "wertpapier-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/backtest.html reports/backtest_summary.md
          git diff --cached --quiet || git commit -m "Backtest $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/
