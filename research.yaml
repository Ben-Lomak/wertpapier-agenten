# Varianten für den Vergleich (python -m bots.runner research).
# Alle mit N26-Kosten, 10.000 € Start, PT-Steuern. Felder wie unter agents in config.yaml.

etf_universe: &etfs [EUNL.DE, SXR8.DE, EXXT.DE, EXSA.DE, IS3N.DE, 4GLD.DE]

long_hold_risk: &long_risk
  trailing_stop_pct: 0.25
  max_drawdown_pct: null
  market_filter_buffer: 0.03
  drift_threshold: 0.10

variants:
  v1_momentum:
    label: "V1 Momentum (aktuell)"
    universe: universes/global_momentum.txt
    strategy: momentum
    positions: 8
    rebalance: weekly
    lookback_days: 252
    skip_days: 21
    trend_sma: 100

  v1_sustainable:
    label: "V1 Nachhaltig (aktuell)"
    universe: universes/sustainable.txt
    strategy: sustainable
    positions: 10
    rebalance: monthly
    lookback_days: 126
    skip_days: 21
    trend_sma: 200
    vol_days: 63
    momentum_weight: 0.6

  v2_momentum:
    label: "V2 Momentum, monatlich, Rangpuffer"
    universe: universes/global_momentum.txt
    strategy: momentum
    positions: 8
    rebalance: monthly
    lookback_days: 252
    blend_lookbacks: [126, 252]
    skip_days: 21
    trend_sma: 200
    hold_buffer: 2.0
    risk: *long_risk

  v2_momentum_q:
    label: "V2 Momentum, quartalsweise"
    universe: universes/global_momentum.txt
    strategy: momentum
    positions: 8
    rebalance: quarterly
    lookback_days: 252
    blend_lookbacks: [126, 252]
    skip_days: 21
    trend_sma: 200
    hold_buffer: 2.0
    risk: *long_risk

  v2_momentum_nostop:
    label: "V2 Momentum ohne Trailing-Stop"
    universe: universes/global_momentum.txt
    strategy: momentum
    positions: 8
    rebalance: monthly
    lookback_days: 252
    blend_lookbacks: [126, 252]
    skip_days: 21
    trend_sma: 200
    hold_buffer: 2.0
    risk: {<<: *long_risk, trailing_stop_pct: null}

  v2_sustainable:
    label: "V2 Nachhaltig, monatlich, Rangpuffer"
    universe: universes/sustainable.txt
    strategy: sustainable
    positions: 10
    rebalance: monthly
    lookback_days: 252
    skip_days: 21
    trend_sma: 200
    vol_days: 63
    momentum_weight: 0.6
    hold_buffer: 2.0
    risk: *long_risk

  v2_sustainable_q:
    label: "V2 Nachhaltig, quartalsweise"
    universe: universes/sustainable.txt
    strategy: sustainable
    positions: 10
    rebalance: quarterly
    lookback_days: 252
    skip_days: 21
    trend_sma: 200
    vol_days: 63
    momentum_weight: 0.6
    hold_buffer: 2.0
    risk: *long_risk

  etf_dual_momentum:
    label: "ETF-Rotation (2 aus 6)"
    universe: *etfs
    strategy: dual_momentum
    positions: 2
    rebalance: monthly
    blend_lookbacks: [63, 126, 252]
    defensive: EUNH.DE
    market_filter: false
    hold_buffer: 1.5
    risk: {trailing_stop_pct: null, max_drawdown_pct: null, max_position_pct: 0.49, drift_threshold: 0.15}

  etf_trend_world:
    label: "MSCI World mit Trendfilter"
    universe: [EUNL.DE]
    strategy: trend_etf
    positions: 1
    rebalance: weekly
    trend_sma: 200
    band: 0.02
    market_filter: false
    risk: {trailing_stop_pct: null, max_drawdown_pct: null, max_position_pct: 0.98, drift_threshold: 0.5}

  buyhold_world:
    label: "MSCI World kaufen und halten"
    universe: [EUNL.DE]
    strategy: buyhold
    positions: 1
    rebalance: monthly
    market_filter: false
    risk: {trailing_stop_pct: null, max_drawdown_pct: null, max_position_pct: 0.98, drift_threshold: 0.5}

  v3_sustainable_mom:
    label: "V3 Nachhaltig, reines Momentum"
    universe: universes/sustainable.txt
    strategy: momentum
    positions: 8
    rebalance: monthly
    lookback_days: 252
    blend_lookbacks: [126, 252]
    skip_days: 21
    trend_sma: 200
    hold_buffer: 2.0
    risk: *long_risk

  v3_momentum_12:
    label: "V3 Momentum, 12 Titel (breiter gestreut)"
    universe: universes/global_momentum.txt
    strategy: momentum
    positions: 12
    rebalance: monthly
    lookback_days: 252
    blend_lookbacks: [126, 252]
    skip_days: 21
    trend_sma: 200
    hold_buffer: 2.0
    risk: {<<: *long_risk, max_position_pct: 0.10}

  high_risk:
    label: "High Risk: KI, Robotik, Raumfahrt"
    universe: universes/high_risk_ai_robotics_space.txt
    strategy: momentum
    positions: 6
    rebalance: monthly
    lookback_days: 126
    blend_lookbacks: [63, 126, 252]
    skip_days: 5
    trend_sma: 100
    hold_buffer: 1.5
    market_filter: false
    risk: {max_drawdown_pct: null, trailing_stop_pct: 0.35, capital_floor_pct: 0.50, max_position_pct: 0.17, drift_threshold: 0.12}
